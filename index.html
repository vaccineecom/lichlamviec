<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Làm Việc – Vaccine eCommerce</title>

  <!-- ═══════════════════════════════════════════════════════════════════════
       HƯỚNG DẪN CẬP NHẬT (chỉ sửa 1 dòng duy nhất bên dưới):

       Mỗi khi bạn deploy Apps Script mới và có link ".../exec" mới,
       chỉ cần thay giá trị của APPS_SCRIPT_URL bên dưới bằng link mới,
       rồi commit lên GitHub. Mọi người vẫn dùng chung 1 link GitHub Pages.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    // 👇👇👇  DÁN LINK APPS SCRIPT MỚI VÀO ĐÂY (giữ nguyên dấu ngoặc kép)  👇👇👇
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmY1vfmxHI0DR_YBKoCCTAEhuGqqbIaznlDGQyJX32ygCnXQ1cEtz_4vwzP-3fO7190w/exec";
    // 👆👆👆  DÁN LINK APPS SCRIPT MỚI VÀO ĐÂY  👆👆👆
  </script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f7fafc; }
    #app-frame { border: none; width: 100%; height: 100%; display: block; }
    /* Màn hình chờ trong lúc iframe tải */
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #f7fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 10; transition: opacity .4s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px; border: 4px solid #e2e8f0;
      border-top-color: #e5567a; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .txt { color: #4a5568; font-size: 15px; font-weight: 600; }
    #err {
      max-width: 520px; margin: 0 auto; text-align: center; color: #c53030;
      font-family: -apple-system, sans-serif; padding: 24px; display: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="txt">Đang tải Lịch Làm Việc…</div>
  </div>

  <div id="err">
    ⚠️ Chưa cấu hình link Apps Script hợp lệ.<br>
    Hãy mở file này và dán link <code>…/exec</code> vào dòng <code>APPS_SCRIPT_URL</code>.
  </div>

  <iframe id="app-frame" title="Lịch Làm Việc"></iframe>

  <script>
    (function () {
      const frame = document.getElementById('app-frame');
      const loading = document.getElementById('loading');
      const err = document.getElementById('err');

      // Kiểm tra link đã được cấu hình đúng chưa
      const ok = typeof APPS_SCRIPT_URL === 'string'
        && APPS_SCRIPT_URL.indexOf('https://script.google.com/') === 0
        && APPS_SCRIPT_URL.endsWith('/exec');

      if (!ok) {
        loading.style.display = 'none';
        err.style.display = 'block';
        return;
      }

      // Nạp app vào iframe
      frame.src = APPS_SCRIPT_URL;

      // Ẩn màn hình chờ khi iframe tải xong
      frame.addEventListener('load', function () {
        loading.classList.add('hide');
        setTimeout(function () { loading.style.display = 'none'; }, 450);
      });

      // Phòng trường hợp sự kiện load không kích hoạt: ẩn spinner sau 8 giây
      setTimeout(function () {
        loading.classList.add('hide');
        setTimeout(function () { loading.style.display = 'none'; }, 450);
      }, 8000);
    })();
  </script>
</body>
</html>
